name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@v2

      # Locked versions, so CI runs the same ruff/mypy/specdrive as local.
      - run: uv sync --locked --group dev
      - run: pnpm install --frozen-lockfile
      # specs/_specdrive/ is not committed; fetch it from specdrive.yaml.
      - run: pnpm exec specdrive install

      - run: just ci
